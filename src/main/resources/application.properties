spring.application.name=demo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
# Optional ignored local file; actual environment variables have higher priority.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Migrations run as a separate deployment step, never with runtime credentials.
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:86400000}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder.avatar=${CLOUDINARY_FOLDER_AVATAR:Avatar_Eco}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
app.order.pending-timeout-minutes=${APP_ORDER_PENDING_TIMEOUT_MINUTES:15}
app.order.cleanup-interval-ms=${APP_ORDER_CLEANUP_INTERVAL_MS:60000}

wallet.limits.zone=${WALLET_LIMITS_ZONE:Asia/Ho_Chi_Minh}
wallet.limits.request-window=${WALLET_LIMITS_REQUEST_WINDOW:PT10M}
wallet.limits.max-requests=${WALLET_LIMITS_MAX_REQUESTS:10}
wallet.limits.top-up.per-transaction=${WALLET_LIMITS_TOP_UP_PER_TRANSACTION:50000000}
wallet.limits.top-up.per-day=${WALLET_LIMITS_TOP_UP_PER_DAY:100000000}
wallet.limits.withdraw.per-transaction=${WALLET_LIMITS_WITHDRAW_PER_TRANSACTION:20000000}
wallet.limits.withdraw.per-day=${WALLET_LIMITS_WITHDRAW_PER_DAY:50000000}
wallet.limits.payment.per-transaction=${WALLET_LIMITS_PAYMENT_PER_TRANSACTION:50000000}
wallet.limits.payment.per-day=${WALLET_LIMITS_PAYMENT_PER_DAY:100000000}
wallet.bank.call-timeout=${WALLET_BANK_CALL_TIMEOUT:PT10S}
wallet.bank.max-concurrent-calls=${WALLET_BANK_MAX_CONCURRENT_CALLS:4}
wallet.recovery.email-enabled=${WALLET_RECOVERY_EMAIL_ENABLED:false}
wallet.recovery.email-from=${WALLET_RECOVERY_EMAIL_FROM:}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# API documentation is opt-in outside local development.
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${springdoc.api-docs.enabled}
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
# Error responses are documented explicitly with the shared response envelope.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.urls-primary-name=all
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
