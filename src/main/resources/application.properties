spring.application.name=demo

# ============================================================
# Cấu hình Database
# ------------------------------------------------------------
# Giá trị mặc định chỉ dành cho môi trường dev ở máy cá nhân.
# Khi deploy PHẢI truyền biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Cấu hình JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt Open-Session-In-View: mọi truy cập lazy-load phải nằm trong transaction.
spring.jpa.open-in-view=false

# ============================================================
# Cấu hình JWT
# ------------------------------------------------------------
# JWT_SECRET là chuỗi Base64 tối thiểu 256 bit. Nếu để trống, ứng dụng sẽ
# sinh khóa ngẫu nhiên mỗi lần khởi động (chỉ dùng cho dev — token sẽ mất
# hiệu lực sau mỗi lần restart).
# ============================================================
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================================
# Cấu hình Cloudinary (KHÔNG commit giá trị thật vào file này)
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder.avatar=${CLOUDINARY_AVATAR_FOLDER:Avatar_Eco}

# ============================================================
# CORS: danh sách origin được phép gọi API, phân tách bằng dấu phẩy
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ============================================================
# Nghiệp vụ đơn hàng
# ------------------------------------------------------------
# Đơn PENDING quá hạn này sẽ bị tự động hủy và hoàn kho.
# ============================================================
app.order.pending-timeout-minutes=${ORDER_PENDING_TIMEOUT_MINUTES:15}
app.order.cleanup-interval-ms=${ORDER_CLEANUP_INTERVAL_MS:60000}

# ============================================================
# Upload file
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Không trả stack trace / thông tin nội bộ ra response lỗi
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
