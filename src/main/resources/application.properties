spring.application.name=demo

# ============================================================
# Cấu hình Database
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Cấu hình JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt Open-Session-In-View: mọi truy cập lazy-load phải nằm trong transaction.
spring.jpa.open-in-view=false

# ============================================================
# Cấu hình JWT
# ------------------------------------------------------------
# app.jwt.secret: chuỗi Base64 tối thiểu 256 bit (32 byte).
# Đổi giá trị này sẽ làm toàn bộ token đang phát hành mất hiệu lực.
# ============================================================
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=86400000

# ============================================================
# Cấu hình Cloudinary
# ============================================================
cloudinary.cloud-name=dtppjhiqp
cloudinary.api-key=711275529461583
cloudinary.api-secret=ZbxvBjl-4V7gHLv4nNpAHtdJzIA
cloudinary.folder.avatar=Avatar_Eco

# ============================================================
# CORS: danh sách origin được phép gọi API, phân tách bằng dấu phẩy
# ============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# ============================================================
# Nghiệp vụ đơn hàng
# ------------------------------------------------------------
# Đơn PENDING quá hạn này sẽ bị tự động hủy và hoàn kho.
# ============================================================
app.order.pending-timeout-minutes=15
app.order.cleanup-interval-ms=60000

# ============================================================
# Upload file
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Không trả stack trace / thông tin nội bộ ra response lỗi
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
